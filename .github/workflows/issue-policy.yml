name: Issue policy

on:
  issues:
    types:
      - opened
      - edited
      - reopened
      - closed
      - labeled
      - unlabeled

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-policy-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  validate-issue:
    name: Validate Issue lifecycle record
    runs-on: ubuntu-latest
    steps:
      - name: Check out policy sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Capture current Issue state
        uses: actions/github-script@v7
        env:
          CURRENT_ISSUE_PATH: issue-policy-event.json
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const fs = require('fs');
            const current = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
            });
            fs.writeFileSync(
              process.env.CURRENT_ISSUE_PATH,
              JSON.stringify({ issue: current.data }),
              'utf8'
            );

      - name: Evaluate repository Issue policy
        id: issue-policy
        shell: bash
        run: |
          set +e
          python scripts/validate-issue.py \
            --event-file issue-policy-event.json \
            --json-output issue-policy-result.json
          validator_exit=$?
          set -e
          echo "validator_exit=$validator_exit" >> "$GITHUB_OUTPUT"
          if [ "$validator_exit" -eq 2 ]; then
            exit 2
          fi

      - name: Apply idempotent policy labels and report
        if: steps.issue-policy.outputs.validator_exit != '2'
        uses: actions/github-script@v7
        env:
          POLICY_RESULT_PATH: issue-policy-result.json
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const fs = require('fs');
            const result = JSON.parse(
              fs.readFileSync(process.env.POLICY_RESULT_PATH, 'utf8')
            );
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.issue.number;
            const currentIssue = await github.rest.issues.get({
              owner,
              repo,
              issue_number,
            });
            const currentLabels = new Set(
              currentIssue.data.labels.map((label) =>
                typeof label === 'string' ? label : label.name
              )
            );
            const policyLabels = new Set(result.policy_labels);
            const desired = result.desired_policy_label;

            if (!currentLabels.has(desired)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: [desired],
              });
            }

            for (const label of policyLabels) {
              if (label === desired || !currentLabels.has(label)) {
                continue;
              }
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number,
                  name: label,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

            const marker = '<!-- cycles-issue-policy-report -->';
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find((comment) =>
              typeof comment.body === 'string' && comment.body.startsWith(marker)
            );

            if (existing && existing.body !== result.report) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: result.report,
              });
            } else if (!existing && !result.valid) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: result.report,
              });
            }

      - name: Fail incomplete Issue policy result
        if: steps.issue-policy.outputs.validator_exit == '1'
        shell: bash
        run: exit 1
